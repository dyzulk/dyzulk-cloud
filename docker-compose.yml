name: dyzulk-cloud-dev

services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'dyzulk-cloud-dev-app:latest'
        container_name: dyzulk-cloud-dev-app
        labels:
            com.dyzulk.environment: 'development'
            com.dyzulk.service: 'sail'
            com.dyzulk.app: 'dyzulk-cloud'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:8000'
            - '${OFFICE_PORT:-8001}:8001'
            - '${API_PORT:-8002}:8002'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        volumes:
            - '.:/var/www/html'
            - '/var/run/docker.sock:/var/run/docker.sock'
        networks:
            - sail-dev
        depends_on:
            pgsql:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '1.5'
                    memory: 2G
                reservations:
                    cpus: '0.25'
                    memory: 512M

    traefik:
        image: 'traefik:v3.0'
        container_name: dyzulk-cloud-dev-ingress
        command:
            - '--api.insecure=true'
            - '--providers.docker=true'
            - '--providers.docker.exposedbydefault=false'
            - '--providers.file.directory=/etc/traefik/dynamic'
            - '--providers.file.watch=true'
            - '--entrypoints.web.address=:80'
            - '--entrypoints.websecure.address=:443'
        environment:
            DOCKER_API_VERSION: "1.40"
        ports:
            - '${TRAEFIK_HTTP_PORT:-80}:80'
            - '${TRAEFIK_HTTPS_PORT:-443}:443'
            - '${TRAEFIK_DASHBOARD_PORT:-8080}:8080'
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
            - './docker/traefik/dynamic:/etc/traefik/dynamic'
        networks:
            - sail-dev
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.1'
                    memory: 64M

    pgsql:
        image: 'postgres:17-alpine'
        container_name: dyzulk-cloud-dev-postgres
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail-dev
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 512M
                reservations:
                    cpus: '0.2'
                    memory: 128M

networks:
    sail-dev:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
