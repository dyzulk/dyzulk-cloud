# Auto-generated by dyzulk-cloud Control Plane via Site Settings
# Do not edit manually; changes will be overwritten.
# Traefik handles ONLY external domain routing on Port 80/443.
# Ports 8000, 8001, 8002 bypass Traefik entirely (direct container access).

http:
  routers:
    dyzulk-cloud-app:
      entryPoints:
        - web
        - websecure
      rule: 'Host(`localhost:8000`)'
      service: dyzulk-cloud-app-service
    dyzulk-cloud-office:
      entryPoints:
        - web
        - websecure
      rule: 'Host(`localhost:8001`)'
      service: dyzulk-cloud-office-service
    dyzulk-cloud-api:
      entryPoints:
        - web
        - websecure
      rule: 'Host(`localhost:8002`)'
      service: dyzulk-cloud-api-service
  services:
    dyzulk-cloud-app-service:
      loadBalancer:
        servers:
          - { url: 'http://dyzulk-cloud-dev-app:8000' }
    dyzulk-cloud-office-service:
      loadBalancer:
        servers:
          - { url: 'http://dyzulk-cloud-dev-app:8001' }
    dyzulk-cloud-api-service:
      loadBalancer:
        servers:
          - { url: 'http://dyzulk-cloud-dev-app:8002' }
